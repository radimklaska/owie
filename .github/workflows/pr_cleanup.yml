name: Clean up PR firmware pre-release
# Deletes the ci-pr-<number> pre-release and tag that build_and_test_all.yml
# publishes for a pull request, once that pull request is closed or merged.
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the per-PR pre-release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ci-pr-${{ github.event.pull_request.number }}
        run: gh release delete "$TAG" --cleanup-tag -y || echo "no release $TAG to delete"
