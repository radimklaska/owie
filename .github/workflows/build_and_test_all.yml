name: Build and test everything
on: [push, pull_request, workflow_call]
permissions:
  # contents: write is needed to publish the per-PR firmware pre-release.
  contents: write
  pull-requests: write
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Install PlatformIO and html-minifier-terser
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
          npm install html-minifier-terser -g
      - name: Install library dependencies
        run: pio lib -g install 1
      - name: Run tests Owie
        id: tests
        run: |
          set -o pipefail
          pio --no-ansi test -e native 2>&1 | tee test-output.txt
      - name: Build Owie
        id: build
        # Build even when a test failed so the PR report can still link the firmware.
        if: always()
        run: |
          set -o pipefail
          pio --no-ansi run -e d1_mini_lite_clone 2>&1 | tee build-output.txt
      - name: Upload artifacts
        id: artifact
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/d1_mini_lite_clone/firmware.bin
      - name: Publish firmware.bin as a direct download (per-PR pre-release)
        # Artifacts are only served as zip files, so the .bin is published as the
        # single asset of a pre-release tagged ci-pr-<number>. The release is
        # recreated on every push (tag follows the PR head) and deleted by
        # pr_cleanup.yml when the PR closes. Fork PRs have a read-only token, so
        # this is allowed to fail; the comment then falls back to the artifact.
        id: firmware
        if: always() && github.event_name == 'pull_request' && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TAG="ci-pr-${PR_NUMBER}"
          NOTES="Automated build of PR #${PR_NUMBER} at ${HEAD_SHA} by the \"Build and test everything\" workflow. Pre-release only: replaced on every push to the PR and deleted when the PR closes. This is not a release of Owie; see Releases for those."
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" .pio/build/d1_mini_lite_clone/firmware.bin \
            --prerelease --target "$HEAD_SHA" --title "CI build for PR #${PR_NUMBER}" --notes "$NOTES"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/firmware.bin" >> "$GITHUB_OUTPUT"
      - name: Report test result and firmware link on the PR
        # Pull requests only (pushes and the tagged-release workflow_call have no PR).
        # Forks get a read-only token, so a failed comment must not fail the build.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          FIRMWARE_URL: ${{ steps.firmware.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const read = (f) => { try { return fs.readFileSync(f, 'utf8'); } catch { return ''; } };
            const tests = read('test-output.txt');
            const build = read('build-output.txt');
            const marker = '<!-- owie-ci-report -->';

            // PlatformIO prints a SUMMARY table followed by "=== N test cases: ... ===".
            const summaryMatch = tests.match(/=+ SUMMARY =+[\s\S]*?\n=+ \d+ test cases?:.*=+/);
            const summary = summaryMatch
              ? summaryMatch[0]
              : tests.split('\n').filter(l => /test cases?:|\[FAILED\]|\[PASSED\]|Error/.test(l)).slice(-15).join('\n');
            const failed = tests.split('\n').filter(l => /\[FAILED\]|:FAIL:/.test(l)).slice(0, 30).join('\n');
            const size = build.split('\n').filter(l => /^(RAM|Flash):/.test(l)).join('\n');

            const icon = o => o === 'success' ? ':white_check_mark:' : o === 'failure' ? ':x:' : ':warning:';
            const pr = context.payload.pull_request;
            const sha = pr.head.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = process.env.ARTIFACT_URL;
            const firmwareUrl = process.env.FIRMWARE_URL;
            const firmwareCell = [
              firmwareUrl ? `[firmware.bin](${firmwareUrl}) (direct download, ${sha})` : '',
              artifactUrl ? `[zip artifact](${artifactUrl})` : '',
            ].filter(Boolean).join(' · ') || 'not available';

            let body = `${marker}\n### CI report for ${sha}\n\n`;
            body += `| check | result |\n|---|---|\n`;
            body += `| native tests | ${icon(process.env.TESTS_OUTCOME)} ${process.env.TESTS_OUTCOME} |\n`;
            body += `| ESP8266 firmware build | ${icon(process.env.BUILD_OUTCOME)} ${process.env.BUILD_OUTCOME} |\n`;
            body += `| compiled firmware | ${firmwareCell} |\n`;
            body += `| workflow run | [${context.runId}](${runUrl}) |\n`;
            if (size) body += `\n\`\`\`\n${size}\n\`\`\`\n`;
            if (failed) body += `\n<details open><summary>Failed tests</summary>\n\n\`\`\`\n${failed}\n\`\`\`\n</details>\n`;
            if (summary) body += `\n<details><summary>Test summary</summary>\n\n\`\`\`\n${summary.trim()}\n\`\`\`\n</details>\n`;
            body += `\n<sub>Posted by the "Build and test everything" workflow and updated on every push. The direct download is a pre-release that is replaced on every push and deleted when the PR closes; the zip artifact needs a GitHub login and expires with the run's retention.</sub>\n`;

            const { owner, repo } = context.repo;
            const issue_number = pr.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`updated comment ${existing.id}`);
            } else {
              const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`created comment ${data.id}`);
            }
