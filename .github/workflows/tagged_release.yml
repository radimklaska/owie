name: "tagged-release"

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-test:
    name: "Build and test all"
    uses: ./.github/workflows/build_and_test_all.yml
  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"
    needs: build-and-test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: ./fw
      - name: Name the firmware after the release tag
        # The build artifact is always firmware.bin; the release asset carries
        # the tag, e.g. firmware_v1.5.0.bin.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mv ./fw/firmware.bin "./fw/firmware_${TAG}.bin"
          ls -l ./fw
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: |
            ./fw/firmware_*.bin
